services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: buyeros
      POSTGRES_PASSWORD: buyeros
      POSTGRES_DB: buyeros
    ports:
      - "55432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buyeros -d buyeros"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  dbdata:
